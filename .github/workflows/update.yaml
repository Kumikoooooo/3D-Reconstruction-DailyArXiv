name: Update

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. This runs at 00:30 Asia/Shanghai.
    - cron: "30 16 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-arxiv-update
  cancel-in-progress: false

jobs:
  update_daily_papers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Update papers
        env:
          ARXIV_SLEEP_SECONDS: "5"
        run: python main.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/ISSUE_TEMPLATE.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Update papers automatically"
            git push
          fi

      - name: Create an issue to notify watchers
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Latest papers - $(TZ=Asia/Shanghai date '+%Y-%m-%d')" \
            --body-file .github/ISSUE_TEMPLATE.md \
            --label documentation
